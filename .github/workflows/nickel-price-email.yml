name: Nickel price email update

on:
  push:
    branches:
      - cursor/nickel-price-email-updates-5340
  schedule:
    # Runs every day at 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-nickel-price-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NICKEL_SMTP_HOST: ${{ secrets.NICKEL_SMTP_HOST || 'smtp.gmail.com' }}
      NICKEL_SMTP_PORT: ${{ secrets.NICKEL_SMTP_PORT || '587' }}
      NICKEL_SMTP_USERNAME: ${{ secrets.NICKEL_SMTP_USERNAME || 'mla770900@gmail.com' }}
      NICKEL_SMTP_PASSWORD: ${{ secrets.NICKEL_SMTP_PASSWORD || secrets.NICKEL }}
      NICKEL_EMAIL_FROM: ${{ secrets.NICKEL_EMAIL_FROM || 'mla770900@gmail.com' }}
      NICKEL_EMAIL_TO: ${{ secrets.NICKEL_EMAIL_TO || 'mla770900@gmail.com' }}
      NICKEL_SMTP_STARTTLS: ${{ vars.NICKEL_SMTP_STARTTLS || 'true' }}
      NICKEL_SMTP_SSL: ${{ vars.NICKEL_SMTP_SSL || 'false' }}
      NICKEL_REQUEST_TIMEOUT_SECONDS: ${{ vars.NICKEL_REQUEST_TIMEOUT_SECONDS || '30' }}
      NICKEL_PRICE_URLS: ${{ vars.NICKEL_PRICE_URLS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate mailer configuration
        run: python3 nickel_price_mailer.py --print-config

      - name: Send nickel price email
        run: python3 nickel_price_mailer.py --once
