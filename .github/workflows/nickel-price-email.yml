name: Nickel price update

on:
  schedule:
    # GitHub schedules are most reliable at 5-minute granularity.
    # The job loops five times so rows are appended about once per minute.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-nickel-price-email:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NICKEL_DISABLE_EMAIL: ${{ vars.NICKEL_DISABLE_EMAIL || 'true' }}
      NICKEL_SMTP_HOST: ${{ secrets.NICKEL_SMTP_HOST }}
      NICKEL_SMTP_PORT: ${{ secrets.NICKEL_SMTP_PORT }}
      NICKEL_SMTP_USERNAME: ${{ secrets.NICKEL_SMTP_USERNAME }}
      NICKEL_SMTP_PASSWORD: ${{ secrets.NICKEL_SMTP_PASSWORD || secrets.NICKEL }}
      NICKEL_EMAIL_FROM: ${{ secrets.NICKEL_EMAIL_FROM }}
      NICKEL_EMAIL_TO: ${{ secrets.NICKEL_EMAIL_TO }}
      NICKEL_SHEETS_WEBHOOK_URL: ${{ secrets.NICKEL_SHEETS_WEBHOOK_URL }}
      NICKEL_SHEETS_SHARED_SECRET: ${{ secrets.NICKEL_SHEETS_SHARED_SECRET }}
      NICKEL_SMTP_STARTTLS: ${{ vars.NICKEL_SMTP_STARTTLS || 'true' }}
      NICKEL_SMTP_SSL: ${{ vars.NICKEL_SMTP_SSL || 'false' }}
      NICKEL_REQUEST_TIMEOUT_SECONDS: ${{ vars.NICKEL_REQUEST_TIMEOUT_SECONDS || '30' }}
      NICKEL_PRICE_URLS: ${{ vars.NICKEL_PRICE_URLS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate updater configuration
        run: python3 nickel_price_mailer.py --print-config

      - name: Update nickel price destinations every minute
        run: |
          for minute in 1 2 3 4 5; do
            echo "Running nickel price update iteration ${minute}/5"
            python3 nickel_price_mailer.py --once
            if [ "$minute" != "5" ]; then
              sleep 60
            fi
          done
